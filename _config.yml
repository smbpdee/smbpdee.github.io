title:               "SMB Subgroup on Population Dynamics, Ecology and Evolution"
url:                 https://smbpdee.github.io/
baseurl:             ""

markdown:            kramdown
highlighter:         rouge

exclude: ['*.sublime-*', 'README.md', 'LICENSE', 'Gemfile', 'Gemfile.lock', 'vendor/bundle']
include: ["_pages"]

permalink:           pretty
paginate:            5
paginate_path:       /blog/:num

sass:
  sass_dir:          _sass
  style:             :compressed

author:
  name:              SMB Subgroup on Population Dynamics, Ecology and Evolution 
  url:               smbpdee.github.io
  email:             smbpdee@gmail.com

plugins:
  - jekyll-coffeescript
  - jekyll-paginate-v2
  - jekyll-gist
  - faraday-retry
